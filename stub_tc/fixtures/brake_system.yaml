# Фикстура заглушки Teamcenter: спецификация тормозной системы самолёта.
# Намеренно содержит «посаженные» слабые места для демонстрации анализа:
#   REQ-1101, REQ-1103 — непроверяемые формулировки (verifiability)
#   REQ-1102          — неатомарность (два требования в одном)
#   REQ-1201 vs REQ-1301 — ЛОГИЧЕСКОЕ ПРОТИВОРЕЧИЕ (100 Н vs 150 Н)
#   REQ-1401, REQ-1301 — нет связей трассируемости -> «Риск сертификации»

spec:
  id: SPEC-BRAKE-001
  name: Спецификация тормозной системы самолёта
  revision: A

users:
  - login: infodba
    password: infodba
    userid: infodba
    first_name: Info
    last_name: DBA
  - login: petrov
    password: petrov
    userid: petrov
    first_name: Пётр
    last_name: Петров
  - login: sidorov
    password: sidorov
    userid: sidorov
    first_name: Сидор
    last_name: Сидоров

# Разделы спецификации (seq — номер раздела, формирует section_path)
sections:
  - id: SS-1100
    name: Общие требования
    seq: 1
  - id: SS-1200
    name: Основное торможение
    seq: 2
  - id: SS-1300
    name: Аварийное и стояночное торможение
    seq: 3
  - id: SS-1400
    name: Контроль и индикация
    seq: 4

# Требования (seq — порядок внутри раздела)
requirements:
  - id: REQ-1101
    section: SS-1100
    seq: 1
    name: Назначение системы
    owner: petrov
    text: |
      Система торможения должна обеспечивать торможение самолёта при разбеге,
      пробеге и рулении и быть достаточно надёжной в эксплуатации.
  - id: REQ-1102
    section: SS-1100
    seq: 2
    name: Архитектура системы
    owner: petrov
    text: |
      Система должна иметь не менее двух независимых каналов управления торможением;
      система должна обеспечивать автоматический контроль давления в гидросистеме.
  - id: REQ-1103
    section: SS-1100
    seq: 3
    name: Условия эксплуатации
    owner: petrov
    text: |
      Система должна сохранять работоспособность в нормальных условиях эксплуатации.
  - id: REQ-1201
    section: SS-1200
    seq: 1
    name: Усилие на органе управления
    owner: petrov
    text: |
      Максимальное усилие на органе управления торможением, необходимое для создания
      полного тормозного давления, должно быть не более 100 Н.
  - id: REQ-1203
    section: SS-1200
    seq: 2
    name: Тормозной путь
    owner: petrov
    text: |
      Тормозной путь самолёта при прерванном взлёте с максимальной взлётной массой
      не должен превышать 1500 м.
  - id: REQ-1204
    section: SS-1200
    seq: 3
    name: Ресурс тормозных дисков
    owner: petrov
    text: |
      Средний ресурс тормозных дисков должен составлять не менее 500 посадок.
  - id: REQ-1301
    section: SS-1300
    seq: 1
    name: Усилие при аварийном торможении
    owner: petrov
    text: |
      Минимальное усилие на органе управления торможением, необходимое для создания
      полного тормозного давления, должно быть не менее 150 Н.
  - id: REQ-1302
    section: SS-1300
    seq: 2
    name: Стояночное торможение
    owner: petrov
    text: |
      Стояночный тормоз должен удерживать самолёт с максимальной взлётной массой
      на уклоне 10 процентов.
  - id: REQ-1303
    section: SS-1300
    seq: 3
    name: Время растормаживания
    owner: petrov
    text: |
      Время растормаживания колёс при аварийном сбросе давления должно быть не более 2 с.
  - id: REQ-1401
    section: SS-1400
    seq: 1
    name: Сигнализация отказов
    owner: petrov
    text: |
      Система должна выдавать сигнализацию об отказе каждого канала управления.
  - id: REQ-1402
    section: SS-1400
    seq: 2
    name: Контроль давления
    owner: petrov
    text: |
      Система должна обеспечивать контроль давления в каждом тормозном контуре
      с выводом информации в кабину экипажа.

# Связи трассируемости TC_Requirement_Trace_Relation (parent -> child).
# ВАЖНО: REQ-1401 и REQ-1301 намеренно НЕ имеют связей.
trace_links:
  - [REQ-1101, REQ-1201]
  - [REQ-1101, REQ-1302]
  - [REQ-1101, REQ-1402]
  - [REQ-1102, REQ-1203]
  - [REQ-1102, REQ-1204]
  - [REQ-1102, REQ-1303]
  - [REQ-1203, REQ-1204]
